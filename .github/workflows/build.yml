name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Build
        run: dotnet build .\SLAPSOUND.csproj --configuration Release --verbosity minimal

      - name: Test
        run: dotnet test .\tests\TapOSTests\TapOSTests.csproj --configuration Release --no-restore --verbosity minimal
